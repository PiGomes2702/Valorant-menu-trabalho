<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>VALORANT</title>

    <style>
        body {
            margin: 0;
            width: 100vw;
            height: 100vh;

            background-image: url("images/smenu.png");
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;

            overflow: hidden;
        }

        /* ÍCONE DO PASSE */
        .passe {
            position: absolute;

            left: 31.5%;
            top: 0%;

            width: 2%;
            height: 3.5%;

            border: none;
            background: transparent;

            cursor: pointer;
        }

        /* ÍCONE DE AGENTES */
        .agentes {
            position: absolute;

            left: 35%;
            top: 0%;

            width: 2%;
            height: 3.5%;

            border: none;
            background: transparent;

            cursor: pointer;
        }

        /* ÍCONE DA LISTA */
        .lista {
            position: absolute;

            left: 38%;
            top: 0%;

            width: 2%;
            height: 3.5%;

            border: none;
            background: transparent;

            cursor: pointer;
        }

        /* BOLSINHA / COLEÇÃO */
        .colecao {
            position: absolute;

            left: 60.5%;
            top: 0%;

            width: 2%;
            height: 3.5%;

            border: none;
            background: transparent;

            cursor: pointer;
        }

        /* ÍCONE DA LOJA — CARRINHO */
        .loja {
            position: absolute;

            left: 63.5%;
            top: 0%;

            width: 2%;
            height: 3.5%;

            border: none;
            background: transparent;

            cursor: pointer;
        }

        /* BOTÃO SUPERIOR DIREITO — SAÍDA */
        .saida {
            position: absolute;

            left: 96%;
            top: 0%;

            width: 4%;
            height: 6%;

            border: none;
            background: transparent;

            cursor: pointer;
        }

        /* BOTÃO MODO - VERMELHO PARA TESTE */
        .modo {
            position: absolute;

            left: 2%;
            top: 40%;

            width: 12%;
            height: 5%;

            border: none;
            background: transparent;

            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- PASSE -->
    <button
        class="passe"
        onclick="abrirPasse()">
    </button>

    <!-- AGENTES -->
    <button
        class="agentes"
        onclick="abrirAgentes()">
    </button>

    <!-- LISTA -->
    <button
        class="lista"
        onclick="abrirLista()">
    </button>

    <!-- BOLSINHA / COLEÇÃO -->
    <button
        class="colecao"
        onclick="abrirColecao()">
    </button>

    <!-- LOJA -->
    <button
        class="loja"
        onclick="abrirLoja()">
    </button>

    <!-- SAÍDA -->
    <button
        class="saida"
        onclick="abrirSaida()">
    </button>

    <!-- BOTÃO MODO -->
    <button
        class="modo"
        onclick="abrirModo()">
    </button>

    <script>
        function abrirPasse() {
            window.location.href = "passe.html";
        }

        function abrirAgentes() {
            window.location.href = "agentes.html";
        }

        function abrirLista() {
            window.location.href = "lista.html";
        }

        function abrirColecao() {
            window.location.href = "armas.html";
        }

        function abrirLoja() {
            window.location.href = "loja.html";
        }

        function abrirSaida() {
            window.location.href = "ssaida.html";
        }

        function abrirModo() {
            window.location.href = "modo.html";
        }

        /* ESC VOLTA PARA O MENU */
        document.addEventListener("keydown", function(event) {
            if (event.key === "Escape") {
                window.location.href = "menu.html";
            }
        });
    </script>

</body>
</html>
